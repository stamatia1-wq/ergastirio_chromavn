
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.app{font-family:var(--font-sans);max-width:500px;margin:0 auto;padding:1.5rem 0;}
.app-title{font-size:22px;font-weight:500;color:var(--color-text-primary);text-align:center;}
.app-sub{font-size:13px;color:var(--color-text-secondary);text-align:center;margin-top:4px;margin-bottom:1.5rem;}
.main-tabs{display:flex;gap:6px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:5px;margin-bottom:1.5rem;}
.mtab{flex:1;padding:9px;border:none;background:transparent;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;color:var(--color-text-secondary);cursor:pointer;transition:all 0.15s;}
.mtab.active{background:var(--color-background-primary);color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary);}
.sub-tabs{display:flex;gap:8px;margin-bottom:1.25rem;}
.stab{flex:1;padding:10px 6px;border:none;border-radius:var(--border-radius-md);font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.stab.physics{background:#fde8e8;color:#9b2222;border:1.5px solid #fde8e8;}
.stab.physics.active{background:#e05555;color:#fff;border-color:#e05555;}
.stab.cs{background:#fff4cc;color:#7a5c00;border:1.5px solid #fff4cc;}
.stab.cs.active{background:#c9a000;color:#fff;border-color:#c9a000;}
.stab.art{background:#ddeeff;color:#1a4f8a;border:1.5px solid #ddeeff;}
.stab.art.active{background:#3a8fd4;color:#fff;border-color:#3a8fd4;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem;}
.color-preview{display:flex;align-items:center;gap:16px;margin-bottom:1.25rem;}
.color-box{width:72px;height:72px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);flex-shrink:0;}
.color-hex{font-size:22px;font-weight:500;color:var(--color-text-primary);font-family:var(--font-mono);}
.color-name-disp{font-size:15px;color:var(--color-text-primary);margin-top:2px;}
.color-rgb{font-size:13px;color:var(--color-text-secondary);font-family:var(--font-mono);}
.slider-group{margin-bottom:0.75rem;}
.slider-header{display:flex;justify-content:space-between;margin-bottom:4px;}
.slider-header span{font-size:14px;color:var(--color-text-primary);}
.slider-header strong{font-size:14px;font-family:var(--font-mono);color:var(--color-text-primary);}
input[type=range]{width:100%;}
.quick-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);letter-spacing:0.08em;text-align:center;margin:0.75rem 0 0.5rem;}
.quick-btns{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:1rem;}
.qbtn{padding:7px 13px;border-radius:var(--border-radius-md);border:none;font-size:13px;font-weight:500;cursor:pointer;}
.synthesis-box{background:#0d0d1a;border-radius:var(--border-radius-md);padding:1rem;margin-bottom:1rem;}
.syn-title{font-size:11px;font-weight:500;color:#666;letter-spacing:0.1em;text-align:center;margin-bottom:0.75rem;}
.circles-wrap{display:flex;justify-content:center;align-items:center;height:130px;position:relative;}
.circle{width:76px;height:76px;border-radius:50%;position:absolute;opacity:0.9;}
.reset-btn{width:100%;padding:10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:14px;color:var(--color-text-primary);cursor:pointer;}
.info-card{border-radius:var(--border-radius-lg);padding:1.25rem;margin-bottom:1rem;}
.info-card.physics{background:#fff8f8;border:1.5px solid #e05555;}
.info-card.cs{background:#fffdf0;border:1.5px solid #c9a000;}
.info-card.art{background:#f0f8ff;border:1.5px solid #3a8fd4;}
.info-title{font-size:16px;font-weight:500;margin-bottom:0.75rem;}
.info-title.physics{color:#a01818;}
.info-title.cs{color:#7a5c00;}
.info-title.art{color:#0d4a8a;}
.info-body{font-size:14px;color:var(--color-text-secondary);line-height:1.7;}
.info-body strong{color:var(--color-text-primary);font-weight:500;}
.info-box{border-radius:var(--border-radius-md);padding:0.85rem 1rem;margin:0.75rem 0;}
.info-box.physics{background:#fde8e8;}
.info-box.cs{background:#fff9e0;}
.info-box.art{background:#ddeeff;}
.info-box li{font-size:14px;color:var(--color-text-secondary);line-height:1.9;list-style:none;}
.code-block{background:#1a1020;border-radius:var(--border-radius-md);padding:1rem;margin:0.75rem 0;font-family:var(--font-mono);font-size:13px;line-height:1.9;}
.cr{color:#ff6b6b;}.cg{color:#6bcb77;}.cb{color:#5599ff;}.cy{color:#ffd93d;}
.quiz-prog-bar{height:5px;background:var(--color-background-secondary);border-radius:3px;margin-bottom:1rem;overflow:hidden;}
.quiz-prog-fill{height:100%;border-radius:3px;transition:width 0.3s;}
.quiz-prog-fill.physics{background:#e05555;}
.quiz-prog-fill.cs{background:#c9a000;}
.quiz-prog-fill.art{background:#3a8fd4;}
.quiz-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:0.75rem;}
.quiz-q{font-size:15px;font-weight:500;color:var(--color-text-primary);margin-bottom:1rem;line-height:1.55;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.qopt{padding:10px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);font-size:14px;color:var(--color-text-primary);cursor:pointer;text-align:left;transition:all 0.15s;}
.qopt:hover:not(:disabled){border-color:var(--color-border-secondary);background:var(--color-background-secondary);}
.qopt.correct{background:#e8f9ee;border-color:#45c97a;color:#1a6e3a;}
.qopt.wrong{background:#fde8e8;border-color:#e05555;color:#8b1a1a;}
.quiz-fb{font-size:14px;padding:9px 14px;border-radius:var(--border-radius-md);margin-bottom:0.75rem;display:none;}
.quiz-fb.show{display:block;}
.quiz-fb.ok{background:#e8f9ee;color:#1a6e3a;}
.quiz-fb.no{background:#fde8e8;color:#8b1a1a;}
.quiz-nav{display:flex;justify-content:flex-end;}
.next-btn{padding:8px 18px;border-radius:var(--border-radius-md);border:none;font-size:14px;font-weight:500;cursor:pointer;color:#fff;display:none;}
.next-btn.show{display:inline-block;}
.next-btn.physics{background:#e05555;}
.next-btn.cs{background:#c9a000;}
.next-btn.art{background:#3a8fd4;}
.done-box{text-align:center;padding:1.5rem 1rem;}
.done-score{font-size:36px;font-weight:500;color:var(--color-text-primary);}
.done-msg{font-size:14px;color:var(--color-text-secondary);margin-top:8px;}
.restart-btn{margin-top:1rem;padding:9px 22px;border-radius:var(--border-radius-md);border:none;font-size:14px;font-weight:500;cursor:pointer;color:#fff;}
.restart-btn.physics{background:#e05555;}
.restart-btn.cs{background:#c9a000;}
.restart-btn.art{background:#3a8fd4;}
</style>

<script>
function toHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');}
function colorName(r,g,b){
  if(r<12&&g<12&&b<12)return'Μαύρο';
  if(r>243&&g>243&&b>243)return'Λευκό';
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  if(mx-mn<30)return'Γκρι';
  if(r>=mx&&g>=mx*0.85&&b<mx*0.4)return'Κίτρινο';
  if(r>=mx&&g>=mx*0.6&&b<mx*0.4)return'Πορτοκαλί';
  if(r>=mx&&b>=mx*0.7&&g<mx*0.4)return'Ματζέντα';
  if(r>=mx)return'Κόκκινο';
  if(g>=mx&&b>=mx*0.7&&r<mx*0.4)return'Κυανό';
  if(g>=mx)return'Πράσινο';
  if(b>=mx&&r>=mx*0.55)return'Μοβ';
  if(b>=mx)return'Μπλε';
  return'Μικτό χρώμα';
}
function upd(){
  const r=+document.getElementById('sr').value,g=+document.getElementById('sg').value,b=+document.getElementById('sb').value;
  document.getElementById('rv').textContent=r;
  document.getElementById('gv').textContent=g;
  document.getElementById('bv').textContent=b;
  const hex=toHex(r,g,b);
  document.getElementById('colorBox').style.background=hex;
  document.getElementById('hexVal').textContent=hex.toUpperCase();
  document.getElementById('rgbVal').textContent='rgb('+r+', '+g+', '+b+')';
  document.getElementById('colorNameDisp').textContent=colorName(r,g,b);
  document.getElementById('cR').style.background='rgb('+r+',0,0)';
  document.getElementById('cG').style.background='rgb(0,'+g+',0)';
  document.getElementById('cB').style.background='rgb(0,0,'+b+')';
}
function setRGB(r,g,b){
  document.getElementById('sr').value=r;
  document.getElementById('sg').value=g;
  document.getElementById('sb').value=b;
  upd();
}
upd();

function showMain(t){
  document.querySelectorAll('.mtab').forEach((el,i)=>el.classList.toggle('active',['lab','quiz','info'][i]===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
}

const infoHTML={
  physics:`<div class="info-card physics">
    <div class="info-title physics">Φυσική: Σύνθεση Φωτός</div>
    <div class="info-body">
      Το λευκό φως περιέχει <strong>όλα τα χρώματα</strong> μαζί. Το πρίσμα το διασπά στα χρώματα του ουράνιου τόξου.<br><br>
      Το μάτι έχει <strong>κώνους</strong> που ανιχνεύουν 3 χρώματα φωτός: κόκκινο, πράσινο, μπλε. Ο εγκέφαλος συνδυάζει τα σήματα και βλέπουμε εκατομμύρια χρώματα.
      <div class="info-box physics">
        <div style="font-size:13px;font-weight:500;color:#8b1a1a;margin-bottom:6px;">Μήκη κύματος:</div>
        <li><span class="cr">●</span> Κόκκινο: ~700 nm</li>
        <li><span class="cg">●</span> Πράσινο: ~550 nm</li>
        <li><span class="cb">●</span> Μπλε: ~450 nm</li>
      </div>
      <strong>Ανάμειξη φωτός:</strong> όσο περισσότερο φως προσθέτεις, τόσο πιο κοντά στο <strong>Λευκό</strong>.
    </div>
  </div>`,
  cs:`<div class="info-card cs">
    <div class="info-title cs">Πληροφορική: Το μοντέλο RGB</div>
    <div class="info-body">
      Κάθε pixel αποτελείται από 3 LED: <span class="cr"><strong>Κόκκινο</strong></span>, <span class="cg"><strong>Πράσινο</strong></span>, <span class="cb"><strong>Μπλε</strong></span>.<br><br>
      Κάθε LED έχει 256 επίπεδα έντασης <strong></strong> (0:σβηστό) έως <strong>255</strong> (100% μέγιστο).<br>
      Σύνολο: 256×256×256 = <strong>16.777.216 χρώματα(24-bit True Color)</strong>.
      <div class="code-block">
        <span class="cr">r = 255 → Κόκκινο</span><br>
        <span class="cg">g = 255 → Πράσινο</span><br>
        <span class="cb">b = 0 &nbsp;→ Μπλε: 0</span><br>
        <span class="cy">αποτέλεσμα → Κίτρινο!</span>
      </div>
      Ο κωδικός <strong>#FFFF00</strong> είναι ο ίδιος αριθμός σε δεκαεξαδικό σύστημα.
    </div>
  </div>`,
  art:`<div class="info-card art">
    <div class="info-title art">Καλλιτεχνικά: Σύνθεση Χρωμάτων</div>
    <div class="info-body">
      Στη ζωγραφική βασικά χρώματα: <strong>Κόκκινο, Κίτρινο, Μπλε</strong>.
      <div class="info-box art">
        <div style="font-size:13px;font-weight:500;color:#0d3a6e;margin-bottom:6px;">Αναμίξεις:</div>
        <li>🔴 + 🟡 Κόκκινο + Κίτρινο = <strong>Πορτοκαλί</strong></li>
        <li>🟡 + 🔵 Κίτρινο + Μπλε = <strong>Πράσινο</strong></li>
        <li>🔴 + 🔵 Κόκκινο + Μπλε = <strong>Μοβ</strong></li>
        <li>🔴 + 🟡 + 🔵 Και τα τρία = <strong>Σκούρο / Μαύρο</strong></li>
      </div>
      <div class="info-box art">
        <div style="font-size:13px;font-weight:500;color:#0d3a6e;margin-bottom:6px;">Φως vs Μπογιά:</div>
        <li>💡 Φως: Όλα μαζί → <strong>Λευκό</strong></li>
        <li>🖌️ Μπογιά: Όλα μαζί → <strong>Μαύρο</strong></li>
      </div>
    </div>
  </div>`
};

let curInfo='physics';
function showInfo(s){
  curInfo=s;
  document.querySelectorAll('#infoSubTabs .stab').forEach(el=>{el.classList.remove('active');if(el.classList.contains(s))el.classList.add('active');});
  document.getElementById('infoArea').innerHTML=infoHTML[s];
}
showInfo('physics');

const quizData={
  physics:[
    {q:'Τι συμβαίνει όταν ανακατέψεις κόκκινο και πράσινο φως;',opts:['Γίνεται μπλε','Γίνεται κίτρινο','Γίνεται μαύρο','Γίνεται ροζ'],ans:1},
    {q:'Ποιο χρώμα φωτός έχει το μικρότερο μήκος κύματος;',opts:['Κόκκινο','Πράσινο','Μπλε','Κίτρινο'],ans:2},
    {q:'Τι παράγεται όταν συνδυαστούν κόκκινο, πράσινο και μπλε φως στη μέγιστη ένταση;',opts:['Μαύρο','Γκρι','Λευκό','Κυανό'],ans:2},
    {q:'Ποιο όργανο του ματιού ανιχνεύει τα χρώματα;',opts:['Ράβδοι','Κώνοι','Αμφιβληστροειδής','Κερατοειδής'],ans:1},

    {q:'Τι χρώμα δίνει ο κώδικας #FF0000;',opts:['Πράσινο','Μπλε','Κόκκινο','Λευκό'],ans:2},

    {q:'Κόκκινο + Κίτρινο =',opts:['Πράσινο','Μοβ','Πορτοκαλί','Καφέ'],ans:2},
    {q:'Τι παράγει η ανάμειξη όλων των μπογιών;',opts:['Λευκό','Γκρι','Κίτρινο','Σκούρο/Μαύρο'],ans:3},
    {q:'Κίτρινο + Μπλε =',opts:['Πορτοκαλί','Πράσινο','Μοβ','Καφέ'],ans:1},
    {q:'Φως vs Μπογιά: όταν αναμειχθούν όλα;',opts:['Και τα δύο → Λευκό','Και τα δύο → Μαύρο','Φως→Λευκό, Μπογιά→Μαύρο','Φως→Μαύρο, Μπογιά→Λευκό'],ans:2},

let curQuiz='physics',qIdx=0,score=0,answered=false;
function showQuiz(s){
  curQuiz=s;qIdx=0;score=0;answered=false;
  document.querySelectorAll('#quizSubTabs .stab').forEach(el=>{el.classList.remove('active');if(el.classList.contains(s))el.classList.add('active');});
  renderQ();
}
function renderQ(){
  const qs=quizData[curQuiz];
  if(qIdx>=qs.length){
    document.getElementById('quizArea').innerHTML=`<div class="done-box">
      <div class="done-score">${score} / ${qs.length}</div>
      <div class="done-msg">${score===qs.length?'Τέλεια! Τα ξέρεις όλα!':score>=3?'Πολύ καλά! Συνέχισε!':'Μελέτησε λίγο παραπάνω!'}</div>
      <button class="restart-btn ${curQuiz}" onclick="showQuiz('${curQuiz}')">Ξανά από την αρχή</button>
    </div>`;return;
  }
  const q=qs[qIdx];answered=false;
  const pct=Math.round(qIdx/qs.length*100);
  document.getElementById('quizArea').innerHTML=`
    <div class="quiz-prog-bar"><div class="quiz-prog-fill ${curQuiz}" style="width:${pct}%"></div></div>
    <div class="quiz-meta"><span>Ερώτηση ${qIdx+1} από ${qs.length}</span><span>Σκορ: ${score}</span></div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">${q.opts.map((o,i)=>`<button class="qopt" onclick="answer(${i})">${o}</button>`).join('')}</div>
    <div class="quiz-fb" id="qfb"></div>
    <div class="quiz-nav"><button class="next-btn ${curQuiz}" id="nxtBtn" onclick="nextQ()">Επόμενο →</button></div>`;
}
function answer(i){
  if(answered)return;answered=true;
  const q=quizData[curQuiz][qIdx];
  document.querySelectorAll('.qopt').forEach((el,idx)=>{
    el.disabled=true;
    if(idx===q.ans)el.classList.add('correct');
    else if(idx===i)el.classList.add('wrong');
  });
  const fb=document.getElementById('qfb');
  if(i===q.ans){score++;fb.textContent='Σωστό!';fb.className='quiz-fb show ok';}
  else{fb.textContent='Λάθος. Σωστό: '+q.opts[q.ans];fb.className='quiz-fb show no';}
  document.getElementById('nxtBtn').className='next-btn show '+curQuiz;
}
function nextQ(){qIdx++;renderQ();}
showQuiz('physics');
</script>
